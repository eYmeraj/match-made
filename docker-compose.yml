# The api and worker run the same backend image with the same settings and data.
x-backend: &backend
  build: ./backend
  image: match-made-backend
  environment:
    MATCHMADE_REDIS_URL: redis://redis:6379/0
  volumes:
    - data:/data
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["matchmade-worker"]

  web:
    build: ./frontend
    ports:
      # Single user, no auth: only this machine can reach the app.
      - "127.0.0.1:${MATCHMADE_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
