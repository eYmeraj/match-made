services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      MATCHMADE_REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./backend
    command: ["matchmade-worker"]
    environment:
      MATCHMADE_REDIS_URL: redis://redis:6379/0
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${MATCHMADE_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
