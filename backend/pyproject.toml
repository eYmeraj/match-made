[project]
name = "matchmade"
version = "0.1.0"
description = "Entity resolution API and worker for Match Made"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.2",
    "fastapi>=0.152.0",
    "fastexcel>=0.21.0",
    "jellyfish>=1.3.0",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "scikit-learn>=1.9.1",
    "sparse-dot-topn>=1.2.0",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx2>=2.15.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
matchmade-worker = "matchmade.worker:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
